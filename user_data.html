<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Harishchandrapur-I Dev. Block, Malda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- General Reset & Body Styling --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #fffaf5; /* Very subtle light orange/off-white background */
            color: #333;
            padding: 40px 20px;
        }

        /* --- Admin Container --- */
        .admin-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(214, 81, 8, 0.15); /* Slight orange tinted shadow */
        }

        /* --- Header Styling --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #d65108; /* Orange border */
            padding-bottom: 15px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .emblem {
            width: 45px;
        }

        h1 {
            color: #d65108; /* Orange text */
            font-size: 24px;
            margin-bottom: 3px;
        }
        
        .sub-heading {
            color: #6c757d; 
            font-size: 14px;
            font-weight: bold;
        }

        /* --- Table Styling --- */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        thead {
            background-color: #d65108; /* Orange Table Header */
            color: #ffffff;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #f0e6df;
            vertical-align: middle;
        }

        th {
            font-weight: bold;
            font-size: 15px;
        }

        td {
            font-size: 14px;
            color: #495057;
        }

        tr:hover {
            background-color: #fff4ec; /* Light orange hover effect */
        }

        /* Input fields inside the table */
        .table-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .table-input:focus {
            border-color: #d65108; /* Orange focus outline */
        }

        /* --- Buttons Styling --- */
        .btn {
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-add {
            background-color: #d65108; /* Primary Orange */
            padding: 10px 15px;
            font-size: 14px;
        }
        .btn-add:hover { background-color: #b54306; }

        .btn-save { background-color: #198754; } /* Keep semantic green for save */
        .btn-save:hover { background-color: #157347; }

        .btn-cancel { background-color: #6c757d; }
        .btn-cancel:hover { background-color: #5c636a; }

        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #bb2d3b; }
        
        .btn-reset { background-color: #e57e42; } /* Lighter Orange for PIN */
        .btn-reset:hover { background-color: #cf682c; }

        .btn-edit {
            background-color: #ffc107; /* Warning Yellow for Edit */
            color: #000;
        }
        .btn-edit:hover { background-color: #ffca2c; }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #d65108;
            font-style: italic;
        }

        .password-field {
            font-family: monospace;
            background: #fdf5f0;
            color: #d65108;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            border: 1px solid #fae1d1;
        }
        
        .actions-cell {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        /* --- Footer Styling --- */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #fae1d1;
            text-align: center;
        }
        
        /* --- Full-Width Orange Footer Styling --- */
        .custom-footer {
            background-color: #c85a06; /* Matches the solid orange background */
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            width: 100%;
            margin-top: 50px; /* Provides spacing from the table above */
            font-family: 'Arial', sans-serif;
        }

        .custom-footer p {
            margin: 8px 0;
            font-size: 15px; /* Adjust size to match image proportion */
        }

        .custom-footer p strong {
            font-weight: bold;
        }
        .footer p {
            color: #6c757d;
            font-size: 13px;
        }

        .footer strong {
            color: #d65108;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                
                <div>
                    <h1>Admin Dashboard</h1>
                    <span class="sub-heading">Harishchandrapur-I Development Block, Malda</span>
                </div>
            </div>
            <button id="addUserBtn" class="btn btn-add"><i class="fas fa-plus"></i> Add New User</button>
        </div>

        <!-- Data Table -->
        <div class="table-wrapper">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Mobile Number</th>
                        <th>Designation</th>
                        <th>Secret PIN</th>
                        <th style="min-width: 260px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be populated here via JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Footer -->
      <footer class="custom-footer">
    <p><strong>Harishchandrapur-I Development Block</strong> | Government of West Bengal</p>
    <p>&copy; 2026 All Rights Reserved.</p>
</footer>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('tableBody');
            let isAddingOrEditing = false; 

            // --- FUNCTION TO LOAD DATA FROM LOCALSTORAGE ---
            function loadUsers() {
                isAddingOrEditing = false; 
                tableBody.innerHTML = ''; 
                let userCount = 0;

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);

                    // Check if the key is a 10-digit mobile number 
                    if (/^\d{10}$/.test(key)) {
                        try {
                            const userData = JSON.parse(localStorage.getItem(key));
                            userCount++;

                            const tr = document.createElement('tr');
                            tr.id = `row-${key}`; 
                            
                            const userDesignation = userData.designation || '<span style="color: #adb5bd;">N/A</span>';

                            tr.innerHTML = `
                                <td><strong>${userData.name}</strong></td>
                                <td>${key}</td>
                                <td>${userDesignation}</td>
                                <td><span class="password-field">${userData.pin}</span></td>
                                <td class="actions-cell">
                                    <button class="btn btn-edit" onclick="editUser('${key}')" title="Edit User">
                                        <i class="fas fa-edit"></i> Edit
                                    </button>
                                    <button class="btn btn-reset" onclick="sendSavedPin('${key}')" title="Send Saved PIN">
                                        <i class="fas fa-paper-plane"></i> Send PIN
                                    </button>
                                    <button class="btn btn-delete" onclick="deleteUser('${key}')" title="Delete User">
                                        <i class="fas fa-trash-alt"></i> Delete
                                    </button>
                                </td>
                            `;
                            tableBody.appendChild(tr);
                        } catch (e) {
                            console.error("Error parsing user data for key:", key);
                        }
                    }
                }

                if (userCount === 0) {
                    tableBody.innerHTML = `<tr id="emptyMessageRow"><td colspan="5" class="empty-message"><i class="fas fa-info-circle"></i> No registered users found.</td></tr>`;
                }
            }

            // --- ADD NEW USER ROW ---
            document.getElementById('addUserBtn').addEventListener('click', () => {
                if (isAddingOrEditing) {
                    alert("Please save or cancel the current action first.");
                    return;
                }
                
                isAddingOrEditing = true;

                const emptyMsg = document.getElementById('emptyMessageRow');
                if (emptyMsg) emptyMsg.remove();

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" id="newName" class="table-input" placeholder="Full Name" required></td>
                    <td><input type="tel" id="newMobile" class="table-input" pattern="[0-9]{10}" placeholder="10-digit Mobile" required></td>
                    <td><input type="text" id="newDesignation" class="table-input" placeholder="Designation" required></td>
                    <td><input type="text" id="newPin" class="table-input" placeholder="Create PIN" required></td>
                    <td class="actions-cell">
                        <button class="btn btn-save" onclick="saveNewUser()" title="Save"><i class="fas fa-save"></i> Save</button>
                        <button class="btn btn-cancel" onclick="cancelAction()" title="Cancel"><i class="fas fa-times"></i> Cancel</button>
                    </td>
                `;
                tableBody.insertBefore(tr, tableBody.firstChild);
            });

            // --- SAVE NEW USER ---
            window.saveNewUser = function() {
                const name = document.getElementById('newName').value.trim();
                const mobile = document.getElementById('newMobile').value.trim();
                const designation = document.getElementById('newDesignation').value.trim();
                const pin = document.getElementById('newPin').value.trim();

                if (!name || !mobile || !designation || !pin) {
                    alert("Please fill in all fields."); return;
                }
                if (mobile.length !== 10 || isNaN(mobile)) {
                    alert("Please enter a valid 10-digit mobile number."); return;
                }
                if (localStorage.getItem(mobile)) {
                    alert("A user with this mobile number is already registered."); return;
                }

                localStorage.setItem(mobile, JSON.stringify({ name, designation, pin }));
                alert("User successfully added!");
                loadUsers(); 
            };

            // --- EDIT EXISTING USER ---
            window.editUser = function(oldMobile) {
                if (isAddingOrEditing) {
                    alert("Please save or cancel the current action first.");
                    return;
                }
                
                isAddingOrEditing = true;
                const tr = document.getElementById(`row-${oldMobile}`);
                const userData = JSON.parse(localStorage.getItem(oldMobile));

                tr.innerHTML = `
                    <td><input type="text" id="editName-${oldMobile}" class="table-input" value="${userData.name}" required></td>
                    <td><input type="tel" id="editMobile-${oldMobile}" class="table-input" pattern="[0-9]{10}" value="${oldMobile}" required></td>
                    <td><input type="text" id="editDesignation-${oldMobile}" class="table-input" value="${userData.designation || ''}" required></td>
                    <td><input type="text" id="editPin-${oldMobile}" class="table-input" value="${userData.pin}" required></td>
                    <td class="actions-cell">
                        <button class="btn btn-save" onclick="updateUser('${oldMobile}')" title="Update"><i class="fas fa-save"></i> Update</button>
                        <button class="btn btn-cancel" onclick="cancelAction()" title="Cancel"><i class="fas fa-times"></i> Cancel</button>
                    </td>
                `;
            };

            // --- UPDATE EDITED USER ---
            window.updateUser = function(oldMobile) {
                const newName = document.getElementById(`editName-${oldMobile}`).value.trim();
                const newMobile = document.getElementById(`editMobile-${oldMobile}`).value.trim();
                const newDesignation = document.getElementById(`editDesignation-${oldMobile}`).value.trim();
                const newPin = document.getElementById(`editPin-${oldMobile}`).value.trim();

                if (!newName || !newMobile || !newDesignation || !newPin) {
                    alert("Please fill in all fields."); return;
                }
                if (newMobile.length !== 10 || isNaN(newMobile)) {
                    alert("Please enter a valid 10-digit mobile number."); return;
                }

                if (newMobile !== oldMobile && localStorage.getItem(newMobile)) {
                    alert("A user with this new mobile number already exists."); return;
                }

                if (newMobile !== oldMobile) {
                    localStorage.removeItem(oldMobile);
                }

                localStorage.setItem(newMobile, JSON.stringify({ name: newName, designation: newDesignation, pin: newPin }));
                alert("User successfully updated!");
                loadUsers(); 
            };

            // --- CANCEL ADD/EDIT ---
            window.cancelAction = function() {
                loadUsers(); 
            };

            // --- SEND SAVED PASSWORD ---
            window.sendSavedPin = function(mobileNumber) {
                const userData = JSON.parse(localStorage.getItem(mobileNumber));
                if (confirm(`Send the saved PIN to ${mobileNumber}?`)) {
                    alert(`[SIMULATION: SMS SENT]\n\nTo: ${mobileNumber}\nMessage: "Hello ${userData.name}, your login PIN for Harishchandrapur-I Dev. Block is: ${userData.pin}"`);
                }
            };

            // --- DELETE A USER ---
            window.deleteUser = function(mobileNumber) {
                if (confirm(`Are you sure you want to delete the user with mobile number ${mobileNumber}?`)) {
                    localStorage.removeItem(mobileNumber);
                    loadUsers(); 
                }
            };

            // Initial load
            loadUsers();
        });
    </script>
</body>
</html>
